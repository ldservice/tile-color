<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ec">
  <meta name="description" content="Интерактивный конфигуратор фасада: трафаретный кирпич — форма кладки, цвет кирпича и цвет шва.">
  <title>Конфигуратор фасада — трафаретный кирпич</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c5c7c4'/%3E%3Crect x='3' y='4' width='12' height='7' fill='%238c402b'/%3E%3Crect x='17' y='4' width='12' height='7' fill='%238c402b'/%3E%3Crect x='3' y='13' width='5' height='7' fill='%238c402b'/%3E%3Crect x='10' y='13' width='12' height='7' fill='%238c402b'/%3E%3Crect x='24' y='13' width='5' height='7' fill='%238c402b'/%3E%3Crect x='3' y='22' width='12' height='7' fill='%238c402b'/%3E%3Crect x='17' y='22' width='12' height='7' fill='%238c402b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <div class="preview">
      <div class="modes" id="modes" role="radiogroup" aria-label="Режим превью">
        <button type="button" role="radio" data-id="photo" aria-checked="true">Фото дома</button>
        <button type="button" role="radio" data-id="scheme" aria-checked="false">Схема кладки</button>
      </div>
      <canvas id="wall" aria-label="Превью кладки"></canvas>
      <div class="caption" id="caption" aria-live="polite"></div>
    </div>

    <div class="controls">
      <section>
        <h2><span class="step">1</span>Форма кирпича</h2>
        <div class="patterns" id="patterns" role="radiogroup" aria-label="Форма кирпича"></div>
      </section>

      <section>
        <h2><span class="step">2</span>Цвет кирпича</h2>
        <div class="swatches" id="brickSwatches" role="radiogroup" aria-label="Цвет кирпича"></div>
        <div class="sel" id="brickSel"></div>
      </section>

      <section>
        <h2><span class="step">3</span>Цвет шва</h2>
        <div class="swatches" id="jointSwatches" role="radiogroup" aria-label="Цвет шва"></div>
        <div class="sel" id="jointSel"></div>
      </section>

      <button class="save" id="saveBtn" type="button">Сохранить картинку</button>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
